<!doctype html>
<!--
  Set overlay in team mode (MTFV set leagues, e.g. Verbandsliga: D1 E1 D2 E2
  D3, two sets each). Shows the current game, its set, the sets of this game
  per team and the overall sets. The server adds /overlay.js, which fills the
  {{placeholders}} live and sets tfc-empty, tfc-changed and tfc-idle
  (ADR 0011). Add it to OBS as a URL:
  http://<server>:8080/overlay/mtfv_sets, width 1920, height 1080.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="tfc:name" content="MTFV Sätze">
<meta name="tfc:sources" content="mtfv">
<meta name="tfc:format" content="sets">
<title>Spieltag</title>
<style>
  /* TFC Leipzig club blues, from the original player_overlay.html */
  :root {
    color-scheme: dark;
    --tfc-dark: #204f6c;
    --tfc-mid: #469cd2;
    --tfc-light: #63b1dc;
    --tfc-gradient: linear-gradient(45deg, var(--tfc-dark), var(--tfc-mid));
  }
  html, body { margin: 0; background: transparent; }
  body {
    font-family: Helvetica, Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .board {
    position: absolute; left: 40px; bottom: 40px;
    min-width: 456px;
    background: rgba(32, 79, 108, 0.92);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
  }
  .title {
    display: flex; justify-content: space-between; align-items: center; gap: 24px;
    padding: 8px 16px;
    background: var(--tfc-gradient);
    font-size: 18px; letter-spacing: 0.02em;
  }
  .row {
    display: grid; grid-template-columns: 1fr auto auto;
    align-items: center; gap: 16px;
    padding: 10px 16px;
  }
  .row + .row { border-top: 1px solid rgba(99, 177, 220, 0.35); }
  .team { font-size: 26px; font-weight: 700; }
  .players { font-size: 17px; color: var(--tfc-light); margin-top: 2px; }
  .sets { font-size: 22px; opacity: 0.8; min-width: 28px; text-align: center; }
  .score {
    font-size: 40px; font-weight: 700; min-width: 64px; text-align: center;
    font-variant-numeric: tabular-nums;
    transition: transform 150ms ease-out, color 150ms;
  }
  .score.tfc-changed { transform: scale(1.25); color: var(--tfc-light); }

  /* Hide what has nothing to show. */
  body.tfc-idle .board,
  .game > .tfc-empty, .players.tfc-empty, .sets.tfc-empty { display: none; }
  /* " · " between the parts that are shown */
  .game > span:not(.tfc-empty) ~ span:not(.tfc-empty)::before { content: " · "; }
</style>
</head>
<body>
<div class="board">
  <div class="title">
    <span>{{tournamentName}}</span>
    <span class="game"><span>{{gameName}}</span><span>Satz {{setNumber}}</span><span>Sätze {{matchPointsA}}:{{matchPointsB}}</span></span>
  </div>
  <div class="row">
    <div>
      <div class="team">{{teamA}}</div>
      <div class="players">{{teamAPlayer}}</div>
    </div>
    <div class="sets">{{setsA}}</div>
    <div class="score">{{scoreA}}</div>
  </div>
  <div class="row">
    <div>
      <div class="team">{{teamB}}</div>
      <div class="players">{{teamBPlayer}}</div>
    </div>
    <div class="sets">{{setsB}}</div>
    <div class="score">{{scoreB}}</div>
  </div>
</div>
</body>
</html>
